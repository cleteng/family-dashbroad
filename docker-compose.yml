# family-dashboard production compose (TASK-025 + TASK-026 Caddy)
#
# Local / app-only:
#   cp .env.example .env && edit secrets
#   docker compose up -d --build
#
# VPS with HTTPS (Caddy):
#   set DOMAIN=dash.example.com and APP_URL=https://dash.example.com in .env
#   docker compose --profile with-caddy up -d --build
#   (do not publish app port publicly when using Caddy)

services:
  app:
    build: .
    expose:
      - "3000"
    # Optional direct access for debugging (bind localhost only). Override in .env: PUBLISH_APP_PORT=3000
    ports:
      - "${PUBLISH_APP_PORT:-127.0.0.1:3000}:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/data/app.db
      APP_URL: ${APP_URL:-http://localhost:3000}
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      WEATHER_DEFAULT_POSTAL: ${WEATHER_DEFAULT_POSTAL:-J4L 3B3}
      HA_URL: ${HA_URL:-}
      HA_TOKEN: ${HA_TOKEN:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
    volumes:
      - app-data:/data
    restart: unless-stopped
    networks:
      - internal

  caddy:
    image: caddy:2.8-alpine
    profiles: ["with-caddy"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - internal

networks:
  internal:

volumes:
  app-data:
  caddy-data:
  caddy-config:
